log_level: info

storage:
  host: "postgres"
  port: 5432
  database: "orders-db"
  user: "postgres"
  password: "postgres"
  ssl_mode: "disable"
  migrations: true

cache:
  addr: "redis:6379"
  password: "delayed-notifier-password"
  ttl: "10m"
  write_buffer: 1024
  write_workers: 2

server:
  addr: "0.0.0.0:8080"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
  cors: true
  allow_origins:
    - "http://localhost:80"
    - "http://localhost:88"
    - "http://ui:80"
    - "http://ui:88"
